[package]
name = "cwst"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Web store: encrypted key-value drawers over keyvaluedb-web, unlocked by a caller-supplied secret"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception AND MPL-2.0"
repository = "https://github.com/corbet-foss/cwst"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "src/**",
    "tests/**",
    "README.md",
    "LICENSE",
    "LICENSE.md",
    "LICENSES/*.txt",
]

[lib]
crate-type = ["rlib"]

[dependencies]
# The versions Veilid pins (keyvaluedb 0.2.4) and the crypto crates Veilid's VLD0 uses.
keyvaluedb = "=0.2.4"
keyvaluedb-memorydb = "=0.2.4"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1.8"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = "0.4"
zeroize = "1.8"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
keyvaluedb-web = "=0.2.4"
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
futures-executor = "0.3"

# Argon2 is deliberately slow; unoptimised test builds would take seconds per unlock.
[profile.test.package.argon2]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
